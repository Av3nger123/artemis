# Pinned to golangci-lint v2.14.0 -- the same version .github/workflows/ci.yml
# installs and the Makefile's lint target suggests. Pinned on purpose: an
# unpinned linter turns someone else's release into a red build on a branch
# nobody touched.
version: "2"
run:
  tests: true
linters:
  # The default set is errcheck, gosimple, govet, ineffassign, staticcheck and
  # unused. These are the additions worth the noise. gofmt/goimports moved to
  # the formatters section below -- that's a v2 schema split, not a drop.
  enable:
    - bodyclose
    - misspell
    - revive
    - unconvert
  settings:
    misspell:
      locale: UK
    revive:
      rules:
        # Exported symbols should say what they are for. The ART-1..ART-7 packages
        # already do; the older ones are being brought up as they are touched.
        - name: exported
          disabled: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # A test asserting an error message does not need to check the error from
      # every helper it calls. And the parser tests misspell keys on purpose --
      # "respones:" is the typo ART-7 exists to catch -- so misspell has no
      # business reading them.
      - linters:
          - bodyclose
          - errcheck
          - misspell
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
