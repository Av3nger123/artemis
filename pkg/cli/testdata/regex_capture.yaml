# A capture off a body that is not JSON at all. The first step's response is
# plain text, so there is no path to read -- the regex reads the bytes -- and the
# value is templated into the second step's url, which is what proves a capture
# landed in the scenario's scope.
name: "regex capture"
type: functional
variables:
  - name: base
    value: "%SERVER%"
steps:
  - name: "read the redirect"
    type: api
    request:
      url: "{{base}}/redirect"
      method: "GET"
    response:
      status_code: 200
    capture:
      itemId: {regex: "/items/([0-9]+)"}
  - name: "read the item back"
    type: api
    request:
      url: "{{base}}/items/{{itemId}}"
      method: "GET"
    response:
      status_code: 200
      body:
        - path: "$.id"
          value: 42
