name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run it supersedes: nobody reads the
# CI result of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Every action is pinned to a commit, with its version beside it: a tag can be
# moved to other code, a commit cannot.

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    # pkg/steps/dbstep's server tests run against these, through the two
    # ARTEMIS_TEST_*_URL variables on `go test` below; without them the tests
    # skip and SQLite, in-process, is the only database covered.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: "p@ss:w/rd"
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app -d shop"
          --health-interval 2s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: rootpw
          MYSQL_USER: app
          MYSQL_PASSWORD: "p@ss:w/rd"
          MYSQL_DATABASE: shop
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -uapp -pp@ss:w/rd --silent"
          --health-interval 2s --health-timeout 5s --health-retries 60
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "Art3mis!Pass"
        ports: ["1433:1433"]
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'Art3mis!Pass' -Q 'SELECT 1' -b -o /dev/null"
          --health-interval 5s --health-timeout 5s --health-retries 40
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: Art3misSys
          APP_USER: app
          APP_USER_PASSWORD: Art3misApp
        ports: ["1521:1521"]
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 5s --health-timeout 5s --health-retries 60
      mongo:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: app
          MONGO_INITDB_ROOT_PASSWORD: "p@ss:w/rd"
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The toolchain line of go.mod, not its go line: the go line is the oldest
      # Go the module builds with, the toolchain line the patched one it is
      # built and shipped with.
      - id: toolchain
        run: echo "go=$(sed -n 's/^toolchain go//p' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: true

      # Both builds: the default, with PostgreSQL, MySQL and SQLite, and the
      # full one with every database driver behind its build tag. Vet and the
      # tests run on the full one, so no driver goes untested.
      - name: go build
        run: go build ./... && go build -tags db_all ./...

      - name: go vet
        run: go vet -tags db_all ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -race because the runner makes HTTP calls and the tests stand up
      # servers; a data race that only shows up under load is exactly what a
      # single-threaded run misses.
      #
      # The password has an @, a : and a / in it on purpose: the URL escapes
      # them, and turning a mysql:// URL into the driver's own DSN has to read
      # them back.
      - name: go test
        env:
          ARTEMIS_TEST_POSTGRES_URL: postgres://app:p%40ss%3Aw%2Frd@localhost:5432/shop?sslmode=disable
          ARTEMIS_TEST_MYSQL_URL: mysql://app:p%40ss%3Aw%2Frd@127.0.0.1:3306/shop
          ARTEMIS_TEST_SQLSERVER_URL: sqlserver://sa:Art3mis%21Pass@localhost:1433?database=master
          ARTEMIS_TEST_ORACLE_URL: oracle://app:Art3misApp@localhost:1521/FREEPDB1
          ARTEMIS_TEST_MONGO_URL: mongodb://app:p%40ss%3Aw%2Frd@localhost:27017/shop?authSource=admin
          ARTEMIS_TEST_REDIS_URL: redis://localhost:6379/0
        run: go test -race -tags db_all -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: toolchain
        run: echo "go=$(sed -n 's/^toolchain go//p' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: false

      - uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          # Pinned to the version .golangci.yml is written for. An unpinned
          # linter turns someone else's release into a red build here.
          version: v2.14.0
          args: --timeout=5m --build-tags=db_all

  # A known vulnerability in the Go release or a module that the code actually
  # calls fails the build, rather than shipping in the next release.
  vulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - id: toolchain
        run: echo "go=$(sed -n 's/^toolchain go//p' go.mod)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          cache: true

      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -tags db_all ./...
