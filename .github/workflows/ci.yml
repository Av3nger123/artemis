name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A new push to the same branch cancels the run it supersedes: nobody reads the
# CI result of a commit that has already been replaced.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          # From go.mod, so CI and the module never disagree about the version.
          go-version-file: go.mod
          cache: true

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      # pkg/codegen's execution-parity tests run the *generated* pytest and the
      # *generated* vitest against the same fixture server the interpreter's
      # tests use, and assert the same pass/fail per scenario. Each skips with a
      # note when its toolchain is missing -- which is for a developer's machine,
      # not for here: these are the gates that catch a codegen backend drifting
      # from the interpreter, so CI installs what they need to actually run.
      #
      # Playwright is deliberately not installed on either side. The browser half
      # of the corpus is behind the `browser` build tag for the reason the rest of
      # the browser suite is: CI has no browser and a cold run downloads about
      # 683 MB (docs/browser-engine.md).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install the python test runner
        run: python3 -m pip install --disable-pip-version-check pytest requests

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Globally, because artemis is a Go module and ships no package.json:
      # `npm root -g` is the one place pkg/codegen/jsparity_test.go can find
      # vitest without adding a JavaScript package to this repository.
      - name: install the javascript test runner
        run: npm install -g vitest

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      # -race because the runner makes HTTP calls and the tests stand up
      # servers; a data race that only shows up under load is exactly what a
      # single-threaded run misses.
      - name: go test
        run: go test -race -coverprofile=coverage.out ./...

      - name: coverage
        run: go tool cover -func=coverage.out | tail -1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: warn

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - uses: golangci/golangci-lint-action@v6
        with:
          # Pinned to the version .golangci.yml is written for. An unpinned
          # linter turns someone else's release into a red build here.
          version: v1.64.8
          args: --timeout=5m
